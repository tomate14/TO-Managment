<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["patients","agenda","templates","users","catalogs"],"default":"patients"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active || 'patients';
    function item(key) {
      var on = key === active;
      return { color: on ? '#0E2944' : 'rgba(255,255,255,0.85)', bg: on ? '#E4EEF8' : 'transparent', current: on ? 'page' : 'false' };
    }
    return { patients: item('patients'), agenda: item('agenda'), templates: item('templates'), users: item('users'), catalogs: item('catalogs') };
  }
}
