<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Agenda</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.to-tab:focus-visible,.to-day:focus-visible,.to-chip:focus-visible,.to-ev:focus-visible,.to-icon:focus-visible{outline:3px solid rgba(29,95,168,.45);outline-offset:2px}
.to-ev:hover{filter:brightness(.97)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F8FB; font-family: 'Manrope', system-ui, sans-serif; color: #121A24; display: flex; flex-direction: column; overflow: hidden; position: relative">
<header style="flex-shrink: 0; padding: 20px 20px 12px; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Agenda</h1>
<button type="button" onClick="{{goToday}}" style="height: 40px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #D6E0EA; background: #FFFFFF; color: #121A24; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Hoy</button>
</div>
<div role="tablist" aria-label="Vista de la agenda" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #F0F4F8; border-radius: 14px">
<button type="button" role="tab" class="to-tab" aria-selected="{{calTab.selected}}" onClick="{{showCal}}" style="height: 42px; border: 0; border-radius: 11px; background: {{calTab.bg}}; color: {{calTab.color}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: {{calTab.shadow}}; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Calendario</button>
<button type="button" role="tab" class="to-tab" aria-selected="{{listTab.selected}}" onClick="{{showList}}" style="height: 42px; border: 0; border-radius: 11px; background: {{listTab.bg}}; color: {{listTab.color}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: {{listTab.shadow}}; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="2"></rect><rect x="4" y="13" width="16" height="7" rx="2"></rect></svg>Turnos asignados</button>
</div>
</header>
<sc-if value="{{isCal}}" hint-placeholder-val="{{ true }}">
<div role="tabpanel" aria-label="Calendario" style="flex: 1; min-height: 0; display: flex; flex-direction: column">
<div style="flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #D6E0EA; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
<span style="font-size: 15px; font-weight: 800">Noviembre 2026</span>
<span style="display: flex; gap: 2px">
<button type="button" class="to-icon" aria-label="Semana anterior" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #121A24; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<button type="button" class="to-icon" aria-label="Semana siguiente" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #121A24; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{week}}" as="w" hint-placeholder-count="7">
<button type="button" class="to-day" onClick="{{w.pick}}" aria-pressed="{{w.pressed}}" aria-label="{{w.label}}" style="height: 66px; border: 0; border-radius: 14px; background: transparent; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0">
<span style="font-size: 11px; font-weight: 700; color: {{w.dowColor}}">{{w.letter}}</span>
<span style="width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; background: {{w.circleBg}}; color: {{w.numColor}}">{{w.d}}</span>
<span style="height: 5px; display: flex; gap: 2px"><sc-for list="{{w.dots}}" as="dot" hint-placeholder-count="2"><span style="width: 5px; height: 5px; border-radius: 50%; background: {{dot.c}}; display: block"></span></sc-for></span>
</button>
</sc-for>
</div>
</div>
<div style="flex: 1; min-height: 0; overflow: auto; padding-bottom: 150px">
<div style="padding: 14px 16px 8px; display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 16px; font-weight: 800">{{dayTitle}}</h2>
<span style="font-size: 13px; color: #4F5D6B">{{dayCount}}</span>
</div>
<div style="position: relative; height: 768px; margin: 10px 8px 0 0">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="12">
<span style="position: absolute; left: 0; width: 48px; top: {{h.top}}px; transform: translateY(-50%); text-align: right; font-size: 11px; font-weight: 600; color: #4F5D6B; font-variant-numeric: tabular-nums">{{h.label}}</span>
</sc-for>
<div aria-hidden="true" style="position: absolute; left: 56px; right: 0; top: 0; bottom: 0; background-image: repeating-linear-gradient(to bottom, #E2E8EF 0, #E2E8EF 1px, transparent 1px, transparent 64px)"></div>
<sc-for list="{{events}}" as="e" hint-placeholder-count="4">
<a href="M-Patient.dc.html" class="to-ev" aria-label="{{e.aria}}" style="position: absolute; top: {{e.top}}px; height: {{e.height}}px; left: {{e.left}}; width: {{e.width}}; box-sizing: border-box; padding: 6px 8px; border-radius: 10px; background: {{e.bg}}; color: {{e.fg}}; text-decoration: none; overflow: hidden; display: flex; flex-direction: column; gap: 1px; border: 1px solid #FFFFFF">
<span style="font-size: 12px; font-weight: 800; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.patient}}</span>
<span style="font-size: 11px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.range}} · {{e.therapist}}</span>
</a>
</sc-for>
<sc-if value="{{showNow}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="position: absolute; left: 50px; right: 0; top: {{nowTop}}px; height: 2px; background: #B42318"><span style="position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #B42318; display: block"></span></div>
</sc-if>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{isList}}" hint-placeholder-val="{{ false }}">
<div role="tabpanel" aria-label="Turnos asignados" style="flex: 1; min-height: 0; overflow: auto; padding: 0 16px 160px; display: flex; flex-direction: column; gap: 14px">
<div role="group" aria-label="Período" style="display: flex; gap: 8px; padding-top: 4px">
<sc-for list="{{ranges}}" as="r" hint-placeholder-count="2">
<button type="button" class="to-chip" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid {{r.border}}; background: {{r.bg}}; color: {{r.color}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{r.label}}</button>
</sc-for>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 4px 4px 0; font-size: 14px; font-weight: 800; color: #0E2944">{{g.title}} <span style="font-weight: 600; color: #4F5D6B">· {{g.count}}</span></h2>
<sc-for list="{{g.items}}" as="c" hint-placeholder-count="3">
<article style="background: #FFFFFF; border: 1px solid #D6E0EA; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 12px; align-items: flex-start">
<div style="width: 58px; flex-shrink: 0; display: flex; flex-direction: column; gap: 1px; font-variant-numeric: tabular-nums">
<span style="font-size: 17px; font-weight: 800; color: #0E2944">{{c.start}}</span>
<span style="font-size: 12px; color: #4F5D6B">a {{c.end}}</span>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 700; line-height: 1.25">{{c.patient}}</span>
<span style="font-size: 13px; color: #4F5D6B; line-height: 1.35">{{c.dx}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: {{c.fg}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.dot}}; display: block"></span>{{c.therapist}}</span>
</div>
<span style="flex-shrink: 0; padding: 4px 9px; border-radius: 999px; background: {{c.stBg}}; color: {{c.stFg}}; font-size: 11px; font-weight: 700">{{c.status}}</span>
</div>
<div style="display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid #EDF1F5">
<a href="M-AppointmentNew.dc.html" style="flex: 1; height: 40px; border-radius: 10px; border: 1.5px solid #D6E0EA; color: #121A24; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; font-weight: 700">Reprogramar</a>
<a href="M-Patient.dc.html" style="flex: 1; height: 40px; border-radius: 10px; background: #E4EEF8; color: #0E2944; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; font-weight: 700">Ver ficha</a>
<button type="button" aria-label="{{c.cancelLabel}}" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; border: 1.5px solid #F3C7C2; background: #FFFFFF; color: #B42318; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</article>
</sc-for>
</section>
</sc-for>
</div>
</sc-if>
<a href="M-AppointmentNew.dc.html" style="position: absolute; right: 20px; bottom: 92px; height: 56px; padding: 0 22px 0 18px; border-radius: 18px; background: #1D5FA8; color: #FFFFFF; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 700; box-shadow: 0 12px 24px -12px rgba(14, 41, 68, 0.7)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nuevo turno</a>
<dc-import name="TabBar" active="agenda" hint-size="390px,76px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"enum","options":["calendar","cards"],"default":"calendar"},"$preview":{"width":390,"height":844}}'>
var THERAPISTS = {
  MG: { name: 'Mariana Gómez', short: 'Mariana', bg: '#DCE8F7', fg: '#0E3A6E', dot: '#1D5FA8' },
  CR: { name: 'Carla Ríos', short: 'Carla', bg: '#D3EEEA', fg: '#0B4F4C', dot: '#0F7B78' },
  PV: { name: 'Paula Vidal', short: 'Paula', bg: '#FBE7CF', fg: '#6B3A06', dot: '#B45309' },
  SN: { name: 'Sofía Núñez', short: 'Sofía', bg: '#E8E0F6', fg: '#45297A', dot: '#6D4AB0' }
};
var PATIENTS = {
  LF: 'Lucía Fernández', JP: 'Julián Pereyra', MS: 'María Inés Sosa', RC: 'Ricardo Castro', AL: 'Agustina López', DM: 'Diego Medina'
};
var DAYS = [
  { d: 2, letter: 'L', long: 'lunes' }, { d: 3, letter: 'M', long: 'martes' }, { d: 4, letter: 'M', long: 'miércoles' },
  { d: 5, letter: 'J', long: 'jueves' }, { d: 6, letter: 'V', long: 'viernes' }, { d: 7, letter: 'S', long: 'sábado' }, { d: 8, letter: 'D', long: 'domingo' }
];
var APPTS = [
  { d: 2, s: '09:00', e: '09:45', p: 'LF', t: 'MG', dx: 'Fractura distal de radio izquierdo', st: 'ok' },
  { d: 2, s: '11:00', e: '11:45', p: 'DM', t: 'CR', dx: 'Tenosinovitis de De Quervain', st: 'ok' },
  { d: 2, s: '15:00', e: '16:00', p: 'MS', t: 'MG', dx: 'Síndrome del túnel carpiano', st: 'ok' },
  { d: 3, s: '08:30', e: '09:15', p: 'JP', t: 'CR', dx: 'Lesión de tendones flexores', st: 'ok' },
  { d: 3, s: '10:00', e: '10:45', p: 'AL', t: 'SN', dx: 'Epicondilitis', st: 'ok' },
  { d: 3, s: '10:00', e: '10:45', p: 'RC', t: 'PV', dx: 'Hombro congelado', st: 'ok' },
  { d: 4, s: '09:00', e: '10:00', p: 'RC', t: 'PV', dx: 'Hombro congelado', st: 'ok' },
  { d: 4, s: '13:30', e: '14:15', p: 'DM', t: 'CR', dx: 'Tenosinovitis de De Quervain', st: 'ok' },
  { d: 5, s: '08:30', e: '09:15', p: 'LF', t: 'MG', dx: 'Fractura distal de radio izquierdo', st: 'ok' },
  { d: 5, s: '09:00', e: '09:45', p: 'JP', t: 'CR', dx: 'Lesión de tendones flexores', st: 'ok' },
  { d: 5, s: '10:30', e: '11:30', p: 'MS', t: 'MG', dx: 'Síndrome del túnel carpiano', st: 'pending' },
  { d: 5, s: '14:00', e: '14:45', p: 'RC', t: 'PV', dx: 'Hombro congelado', st: 'ok' },
  { d: 5, s: '14:15', e: '15:00', p: 'AL', t: 'SN', dx: 'Epicondilitis', st: 'ok' },
  { d: 5, s: '16:30', e: '17:15', p: 'DM', t: 'CR', dx: 'Tenosinovitis de De Quervain', st: 'pending' },
  { d: 6, s: '08:30', e: '09:15', p: 'LF', t: 'MG', dx: 'Fractura distal de radio izquierdo', st: 'ok' },
  { d: 6, s: '09:00', e: '09:45', p: 'AL', t: 'SN', dx: 'Epicondilitis', st: 'ok' },
  { d: 6, s: '12:00', e: '12:45', p: 'JP', t: 'CR', dx: 'Lesión de tendones flexores', st: 'pending' },
  { d: 6, s: '16:00', e: '16:45', p: 'MS', t: 'MG', dx: 'Síndrome del túnel carpiano', st: 'ok' },
  { d: 7, s: '09:00', e: '10:00', p: 'DM', t: 'CR', dx: 'Tenosinovitis de De Quervain', st: 'ok' }
];
var TODAY = 5, NOW = 11 * 60 + 40, START = 8 * 60, PX = 64 / 60;
function toMin(x) { var a = x.split(':'); return Number(a[0]) * 60 + Number(a[1]); }
function layout(list) {
  var ev = list.map(function (a) { return Object.assign({}, a, { sm: toMin(a.s), em: toMin(a.e) }); })
    .sort(function (a, b) { return a.sm - b.sm || b.em - a.em; });
  var cluster = [], lanes = [], end = -1;
  function flush() { cluster.forEach(function (x) { x.n = lanes.length; }); cluster = []; lanes = []; end = -1; }
  ev.forEach(function (x) {
    if (cluster.length && x.sm >= end) flush();
    var i = 0; while (i < lanes.length && lanes[i] > x.sm) i++;
    lanes[i] = x.em; x.lane = i; cluster.push(x); end = Math.max(end, x.em);
  });
  flush();
  return ev;
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: null, day: TODAY, range: 'week' };
  }
  renderVals() {
    var self = this;
    var tab = this.state.tab || this.props.tab || 'calendar';
    var day = this.state.day;
    function seg(on) { return { selected: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', color: on ? '#0E2944' : '#4F5D6B', shadow: on ? '0 1px 3px rgba(14,41,68,0.18)' : 'none' }; }
    var dayInfo = DAYS.filter(function (x) { return x.d === day; })[0];
    var dayAppts = APPTS.filter(function (a) { return a.d === day; });
    var events = layout(dayAppts).map(function (a) {
      var th = THERAPISTS[a.t];
      return {
        top: (a.sm - START) * PX, height: (a.em - a.sm) * PX - 2,
        left: 'calc(56px + (100% - 56px) * ' + a.lane + ' / ' + a.n + ')',
        width: 'calc((100% - 56px) / ' + a.n + ' - 2px)',
        bg: th.bg, fg: th.fg, patient: PATIENTS[a.p], range: a.s + '–' + a.e, therapist: th.short,
        aria: PATIENTS[a.p] + ', ' + a.s + ' a ' + a.e + ', con ' + th.name
      };
    });
    var hours = [];
    for (var h = 8; h < 20; h++) hours.push({ label: (h < 10 ? '0' : '') + h + ':00', top: (h * 60 - START) * PX });
    var shown = APPTS.filter(function (a) { return self.state.range === 'today' ? a.d === TODAY : a.d >= TODAY; });
    var groups = DAYS.filter(function (x) { return shown.some(function (a) { return a.d === x.d; }); }).map(function (x) {
      var items = shown.filter(function (a) { return a.d === x.d; }).sort(function (a, b) { return toMin(a.s) - toMin(b.s); }).map(function (a) {
        var th = THERAPISTS[a.t];
        return {
          start: a.s, end: a.e, patient: PATIENTS[a.p], dx: a.dx, therapist: th.name, fg: th.fg, dot: th.dot,
          status: a.st === 'ok' ? 'Confirmado' : 'A confirmar',
          stBg: a.st === 'ok' ? '#E3F3EA' : '#FFF6E5', stFg: a.st === 'ok' ? '#1B6B42' : '#6B4600',
          cancelLabel: 'Cancelar turno de ' + PATIENTS[a.p]
        };
      });
      var prefix = x.d === TODAY ? 'Hoy · ' : (x.d === TODAY + 1 ? 'Mañana · ' : '');
      var lbl = x.long + ' ' + x.d + ' de noviembre';
        return { title: prefix ? prefix + lbl : lbl.charAt(0).toUpperCase() + lbl.slice(1), count: items.length + (items.length === 1 ? ' turno' : ' turnos'), items: items };
    });
    return {
      isCal: tab === 'calendar', isList: tab === 'cards',
      calTab: seg(tab === 'calendar'), listTab: seg(tab === 'cards'),
      showCal: function () { self.setState({ tab: 'calendar' }); },
      showList: function () { self.setState({ tab: 'cards' }); },
      goToday: function () { self.setState({ day: TODAY }); },
      week: DAYS.map(function (x) {
        var sel = x.d === day, today = x.d === TODAY;
        var ths = [];
        APPTS.forEach(function (a) { if (a.d === x.d && ths.indexOf(a.t) < 0) ths.push(a.t); });
        return {
          d: x.d, letter: x.letter, label: x.long + ' ' + x.d,
          pressed: sel ? 'true' : 'false',
          circleBg: sel ? '#0E2944' : 'transparent',
          numColor: sel ? '#FFFFFF' : (today ? '#1D5FA8' : '#121A24'),
          dowColor: today ? '#1D5FA8' : '#4F5D6B',
          dots: ths.slice(0, 3).map(function (t) { return { c: THERAPISTS[t].dot }; }),
          pick: function () { self.setState({ day: x.d }); }
        };
      }),
      dayTitle: (day === TODAY ? 'Hoy · ' : '') + dayInfo.long + ' ' + day,
      dayCount: dayAppts.length ? dayAppts.length + (dayAppts.length === 1 ? ' turno' : ' turnos') : 'Sin turnos',
      hours: hours, events: events,
      showNow: day === TODAY, nowTop: (NOW - START) * PX,
      ranges: [{ k: 'today', label: 'Hoy' }, { k: 'week', label: 'Esta semana' }].map(function (r) {
        var on = r.k === self.state.range;
        return { label: r.label, pressed: on ? 'true' : 'false', border: on ? '#0E2944' : '#D6E0EA', bg: on ? '#0E2944' : '#FFFFFF', color: on ? '#FFFFFF' : '#121A24', pick: function () { self.setState({ range: r.k }); } };
      }),
      groups: groups
    };
  }
}
</script>
</body>
</html>
