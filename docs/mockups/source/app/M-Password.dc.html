<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cambiar contraseña</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.to-input:focus{outline:none;border-color:#1D5FA8 !important;box-shadow:0 0 0 4px rgba(29,95,168,.18)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F8FB; font-family: 'Manrope', system-ui, sans-serif; color: #121A24; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 60px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; gap: 4px; background: #FFFFFF; border-bottom: 1px solid #D6E0EA">
<a href="M-More.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #121A24"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 700">Cambiar contraseña</h1>
</header>
<form style="flex: 1; margin: 0; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
<div role="alert" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: #FDECEA; color: #8A1C13; font-size: 14px; line-height: 1.45">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5h.01"></path></svg>
<div><strong style="display: block; font-weight: 700">La contraseña actual no es correcta</strong>No se guardó ningún cambio.</div>
</div>
<section style="background: #FFFFFF; border: 1px solid #D6E0EA; border-radius: 18px; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cur" style="font-size: 14px; font-weight: 600">Contraseña actual</label>
<input id="cur" class="to-input" type="password" autocomplete="current-password" value="contrasena" aria-invalid="true" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #B42318; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #121A24">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nw" style="font-size: 14px; font-weight: 600">Nueva contraseña</label>
<input id="nw" class="to-input" type="password" autocomplete="new-password" value="{{pw}}" onChange="{{onPw}}" aria-describedby="nw-hint" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #D6E0EA; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #121A24">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 4px" aria-hidden="true">
<span style="height: 4px; border-radius: 2px; background: {{bar1}}"></span>
<span style="height: 4px; border-radius: 2px; background: {{bar2}}"></span>
<span style="height: 4px; border-radius: 2px; background: {{bar3}}"></span>
<span style="height: 4px; border-radius: 2px; background: {{bar4}}"></span>
</div>
<p id="nw-hint" style="margin: 0; display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; color: {{hintColor}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Mínimo 8 caracteres ({{len}}/8)</p>
</div>
</section>
</form>
<div style="flex-shrink: 0; padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #D6E0EA">
<button type="button" style="width: 100%; height: 52px; border: 0; border-radius: 14px; background: #1D5FA8; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Guardar nueva contraseña</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pw: 'nueva2026' };
  }
  renderVals() {
    var self = this;
    var len = this.state.pw.length;
    var ok = len >= 8;
    var level = Math.min(4, Math.ceil(len / 3));
    function bar(n) { return n <= level ? (ok ? '#1B6B42' : '#B45309') : '#E3E9EF'; }
    return {
      pw: this.state.pw,
      len: Math.min(len, 8),
      hintColor: ok ? '#1B6B42' : '#4F5D6B',
      bar1: bar(1), bar2: bar(2), bar3: bar(3), bar4: bar(4),
      onPw: function (e) { self.setState({ pw: e.target.value }); }
    };
  }
}
</script>
</body>
</html>
