<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["patients","templates","more"],"default":"patients"},"$preview":{"width":390,"height":76}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active || 'patients';
    function item(key) {
      var on = key === active;
      return { color: on ? '#1D5FA8' : '#4F5D6B', bg: on ? '#E4EEF8' : 'transparent', current: on ? 'page' : 'false' };
    }
    return { patients: item('patients'), templates: item('templates'), more: item('more') };
  }
}
</script>
