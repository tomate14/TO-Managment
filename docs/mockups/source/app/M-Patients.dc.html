<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pacientes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.to-input:focus{outline:none;border-color:#1D5FA8 !important;box-shadow:0 0 0 4px rgba(29,95,168,.18)}
.to-row:hover{background:#F5F8FB !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F8FB; font-family: 'Manrope', system-ui, sans-serif; color: #121A24; display: flex; flex-direction: column; overflow: hidden; position: relative">
<header style="padding: 24px 20px 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px; border-bottom: 1px solid #D6E0EA">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Pacientes</h1>
<div style="width: 40px; height: 40px; border-radius: 50%; background: #0E2944; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800" aria-label="Mariana Gómez" role="img">MG</div>
</div>
<div style="position: relative">
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar paciente</label>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F5D6B" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 14px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="q" class="to-input" type="search" placeholder="Buscar por DNI, nombre o apellido" value="{{query}}" onChange="{{onQuery}}" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 16px 0 44px; border-radius: 14px; border: 1.5px solid #D6E0EA; background: #F5F8FB; font-family: inherit; font-size: 16px; color: #121A24">
</div>
</header>
<main style="flex: 1; overflow: auto; padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0 4px 2px; font-size: 13px; font-weight: 600; color: #4F5D6B">{{countLabel}}</p>
<sc-for list="{{rows}}" as="p" hint-placeholder-count="5">
<a href="M-Patient.dc.html" class="to-row" style="display: flex; align-items: center; gap: 14px; padding: 14px 14px; background: #FFFFFF; border: 1px solid #D6E0EA; border-radius: 16px; text-decoration: none; color: #121A24">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #E4EEF8; color: #0E2944; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">{{p.initials}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 700">{{p.name}}</span>
<span style="font-size: 13px; color: #4F5D6B">DNI {{p.dni}} · {{p.insurance}}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F5D6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px 16px; text-align: center; color: #4F5D6B; font-size: 14px; line-height: 1.5">No encontramos pacientes con esa búsqueda.<br>Probá con otro DNI, nombre o apellido.</div>
</sc-if>
<button type="button" style="margin-top: 6px; height: 48px; border-radius: 14px; border: 1.5px solid #D6E0EA; background: #FFFFFF; color: #1D5FA8; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Cargar más</button>
</main>
<a href="M-PatientNew.dc.html" style="position: absolute; right: 20px; bottom: 92px; height: 56px; padding: 0 22px 0 18px; border-radius: 18px; background: #1D5FA8; color: #FFFFFF; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 700; box-shadow: 0 12px 24px -12px rgba(14, 41, 68, 0.7)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nuevo paciente</a>
<dc-import name="TabBar" active="patients" hint-size="390px,76px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var PATIENTS = [
  { initials: 'LF', name: 'Fernández, Lucía', dni: '30.123.456', insurance: 'OSDE' },
  { initials: 'JP', name: 'Pereyra, Julián', dni: '27.845.112', insurance: 'IOMA' },
  { initials: 'MS', name: 'Sosa, María Inés', dni: '35.902.334', insurance: 'Swiss Medical' },
  { initials: 'RC', name: 'Castro, Ricardo', dni: '22.410.876', insurance: 'PAMI' },
  { initials: 'AL', name: 'López, Agustina', dni: '41.276.590', insurance: 'Galeno' },
  { initials: 'DM', name: 'Medina, Diego', dni: '33.018.447', insurance: 'OSDE' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { query: '' };
  }
  renderVals() {
    var self = this;
    var q = this.state.query.trim().toLowerCase().replace(/\./g, '');
    var rows = PATIENTS.filter(function (p) {
      return !q || p.name.toLowerCase().indexOf(q) >= 0 || p.dni.replace(/\./g, '').indexOf(q) >= 0;
    });
    return {
      query: this.state.query,
      rows: rows,
      empty: rows.length === 0,
      countLabel: q ? rows.length + ' resultados' : 'Ordenados por apellido',
      onQuery: function (e) { self.setState({ query: e.target.value }); }
    };
  }
}
</script>
</body>
</html>
