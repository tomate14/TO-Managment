<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Login · Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes to-spin{to{transform:rotate(360deg)}}
.to-spin{animation:to-spin .8s linear infinite}
.to-input:focus{outline:none;border-color:var(--to-accent) !important;box-shadow:0 0 0 4px var(--to-ring)}
.to-btn:hover{background:var(--to-hover) !important}
.to-btn:focus-visible,.to-eye:focus-visible{outline:3px solid var(--to-ring);outline-offset:2px}
.to-eye:hover{background:var(--to-soft) !important}
</style>
</helmet>
<div style="--to-dark: {{c.dark}}; --to-soft: {{c.soft}}; --to-hi: {{c.hi}}; width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Manrope', system-ui, sans-serif; color: #15161A; display: flex; flex-direction: column; overflow: hidden">
<header style="position: relative; height: 216px; flex-shrink: 0; box-sizing: border-box; padding: 28px 24px 52px; background: var(--to-dark); color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden">
<svg viewBox="0 0 600 320" fill="none" aria-hidden="true" style="position: absolute; right: -150px; bottom: -6px; width: 380px; height: auto; display: block"><path d="M60 300 A240 240 0 0 1 540 300" stroke="rgba(255,255,255,0.22)" stroke-width="2"></path><path d="M110 300 A190 190 0 0 1 490 300" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"></path><g stroke="rgba(255,255,255,0.32)" stroke-width="2" stroke-linecap="round"><line x1="60.0" y1="300.0" x2="82.0" y2="300.0"></line><line x1="63.6" y1="258.3" x2="75.5" y2="260.4"></line><line x1="74.5" y1="217.9" x2="85.8" y2="222.0"></line><line x1="92.2" y1="180.0" x2="111.2" y2="191.0"></line><line x1="116.1" y1="145.7" x2="125.3" y2="153.4"></line><line x1="145.7" y1="116.1" x2="153.4" y2="125.3"></line><line x1="180.0" y1="92.2" x2="191.0" y2="111.2"></line><line x1="217.9" y1="74.5" x2="222.0" y2="85.8"></line><line x1="258.3" y1="63.6" x2="260.4" y2="75.5"></line><line x1="300.0" y1="60.0" x2="300.0" y2="82.0"></line><line x1="341.7" y1="63.6" x2="339.6" y2="75.5"></line><line x1="382.1" y1="74.5" x2="378.0" y2="85.8"></line><line x1="420.0" y1="92.2" x2="409.0" y2="111.2"></line><line x1="454.3" y1="116.1" x2="446.6" y2="125.3"></line><line x1="483.9" y1="145.7" x2="474.7" y2="153.4"></line><line x1="507.8" y1="180.0" x2="488.8" y2="191.0"></line><line x1="525.5" y1="217.9" x2="514.2" y2="222.0"></line><line x1="536.4" y1="258.3" x2="524.5" y2="260.4"></line><line x1="540.0" y1="300.0" x2="518.0" y2="300.0"></line></g><line x1="300" y1="300" x2="40" y2="300" stroke="rgba(255,255,255,0.45)" stroke-width="2.5" stroke-linecap="round"></line><line x1="300" y1="300" x2="194.3" y2="73.4" stroke="var(--to-hi)" stroke-width="3" stroke-linecap="round"></line><path d="M180 300 A120 120 0 0 1 249.3 191.2" stroke="var(--to-hi)" stroke-width="3" stroke-linecap="round"></path><circle cx="300" cy="300" r="8" fill="var(--to-hi)"></circle><circle cx="194.3" cy="73.4" r="6" fill="var(--to-hi)"></circle></svg>
<div style="position: relative; display: flex; align-items: center; gap: 12px">
<div style="width: 40px; height: 40px; border-radius: 12px; background: var(--to-soft); color: var(--to-dark); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; letter-spacing: -0.02em">TO</div>
<div style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 700; line-height: 1.2">Terapia Ocupacional</span>
<span style="font-size: 12px; font-weight: 500; line-height: 1.2; color: rgba(255, 255, 255, 0.75)">Gestión clínica</span>
</div>
</div>
<p style="position: relative; margin: 0; max-width: 220px; font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em">Cada sesión, cada segmento, cada avance.</p>
</header>
<main style="position: relative; flex: 1; margin-top: -28px; box-sizing: border-box; padding: 32px 24px 24px; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column">
<dc-import name="LoginForm" state="{{formState}}" palette="{{paletteName}}" hint-size="100%,560px"></dc-import>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["default","error","expired","loading"],"default":"default"},"palette":{"editor":"enum","options":["indigo","oceano","ciruela","grafito","pino"],"default":"oceano"},"$preview":{"width":390,"height":844}}'>
var TO_PALETTES = {
  indigo: { dark: '#221C4A', soft: '#ECEAFB', hi: '#C4BCFF' },
  oceano: { dark: '#0E2944', soft: '#E4EEF8', hi: '#8FC2F2' },
  ciruela: { dark: '#3A1A2E', soft: '#F7E9EF', hi: '#F4B59B' },
  grafito: { dark: '#1C1D22', soft: '#FAF0E4', hi: '#F2B45E' },
  pino: { dark: '#123B34', soft: '#E3EEE9', hi: '#9FD3C3' }
};
class Component extends DCLogic {
  renderVals() {
    var name = TO_PALETTES[this.props.palette] ? this.props.palette : 'oceano';
    return { formState: this.props.state || 'default', paletteName: name, c: TO_PALETTES[name] };
  }
}
</script>
</body>
</html>
