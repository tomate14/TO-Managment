server:
  port: ${BACKEND_PORT}

spring:
  application:
    name: to-management-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${APP_DB_SCHEMA}
  flyway:
    schemas: ${APP_DB_SCHEMA}
    default-schema: ${APP_DB_SCHEMA}
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  time-zone: ${APP_TIME_ZONE}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  registration:
    max-per-hour: ${REGISTRATION_MAX_PER_HOUR}
  trial:
    duration-days: ${TRIAL_DURATION_DAYS}
  initial-admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    name: ${ADMIN_NAME}
