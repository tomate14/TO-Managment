<header class="agenda-header">
  <div class="agenda-header__text">
    <h1 class="agenda-header__title">Agenda</h1>
    <p class="agenda-header__subtitle">{{ subtitle() }}</p>
  </div>
  <div class="agenda-header__actions">
    <app-agenda-tabs [active]="view()" (change)="changeView($event)" />
    <button type="button" class="agenda-header__new" (click)="newAppointment()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nuevo turno
    </button>
  </div>
</header>

<div class="agenda-body">
  @if (isAdmin() && therapists().length > 0) {
    <fieldset class="therapist-filter">
      <legend class="therapist-filter__legend">Terapeutas</legend>
      @for (therapist of therapists(); track therapist.id) {
        <label class="therapist-filter__item">
          <input
            type="checkbox"
            [checked]="selectedTherapistIds().has(therapist.id)"
            (change)="toggleTherapist(therapist.id)"
          />
          <span>{{ therapist.fullName }}</span>
        </label>
      }
    </fieldset>
  }

  <section class="agenda-content">
    @if (error(); as message) {
      <p class="agenda-error" role="alert">{{ message }}</p>
    }
    @if (view() === 'calendario') {
      <div class="agenda-panel" role="tabpanel" id="agenda-panel-calendario" aria-labelledby="agenda-tab-calendario"></div>
    } @else {
      <div class="agenda-panel" role="tabpanel" id="agenda-panel-turnos" aria-labelledby="agenda-tab-turnos"></div>
    }
  </section>
</div>
