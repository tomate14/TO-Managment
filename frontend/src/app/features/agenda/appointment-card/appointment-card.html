<article class="appointment-card">
  <div class="appointment-card__time">
    <span class="appointment-card__start">{{ start() }}</span>
    <span class="appointment-card__end">a {{ end() }}</span>
  </div>
  <a class="appointment-card__patient-link" [routerLink]="['/pacientes', appointment().patient.id]">{{ patientName() }}</a>
  @if (appointment().diagnosis; as diagnosis) {
    <p class="appointment-card__diagnosis">{{ diagnosis.description }}</p>
  }
  <span class="appointment-card__therapist" [class]="therapistClass()">
    <span class="appointment-card__dot" aria-hidden="true"></span>{{ appointment().therapist.fullName }}
  </span>

  @if (confirming()) {
    <div class="appointment-card__confirm" role="alertdialog" aria-label="Confirmar cancelación">
      <p class="appointment-card__confirm-text">¿Cancelar el turno de {{ patientName() }}?</p>
      <div class="appointment-card__actions">
        <button type="button" class="appointment-card__btn appointment-card__btn--danger" data-action="confirm" (click)="confirmCancel()">Sí, cancelar</button>
        <button type="button" class="appointment-card__btn" data-action="keep" (click)="confirming.set(false)">No</button>
      </div>
    </div>
  } @else {
    <div class="appointment-card__actions">
      <button type="button" class="appointment-card__btn" (click)="reschedule.emit(appointment())">Reprogramar</button>
      <a class="appointment-card__btn appointment-card__btn--soft" [routerLink]="['/pacientes', appointment().patient.id]">Ver ficha</a>
      <button type="button" class="appointment-card__cancel" aria-label="Cancelar turno" (click)="confirming.set(true)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
  }
</article>
