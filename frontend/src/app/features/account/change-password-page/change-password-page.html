<header class="page-header">
  <a class="page-header__back page-header__back--mobile-only" routerLink="/mas" aria-label="Volver">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
  </a>
  <h1 class="page-header__title">Cambiar contraseña</h1>
</header>

<form class="password-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (outcome(); as current) {
    <div #banner class="alert" [class.alert--error]="bannerFor(current).kind === 'error'"
         [class.alert--info]="bannerFor(current).kind === 'info'"
         [attr.role]="bannerFor(current).kind === 'error' ? 'alert' : 'status'" tabindex="-1">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>
      <div><strong class="alert__title">{{ bannerFor(current).title }}</strong>{{ bannerFor(current).message }}</div>
    </div>
  }

  <section class="password-form__card">
    <div class="field">
      <label class="field__label" for="current-password">Contraseña actual</label>
      <input id="current-password" class="field__input" type="password" formControlName="currentPassword"
             autocomplete="current-password"
             [class.field__input--invalid]="currentInvalid()" [attr.aria-invalid]="currentInvalid()">
    </div>

    <div class="field">
      <label class="field__label" for="new-password">Nueva contraseña</label>
      <input id="new-password" class="field__input" type="password" formControlName="newPassword"
             autocomplete="new-password" aria-describedby="new-password-hint"
             [class.field__input--invalid]="newInvalid()" [attr.aria-invalid]="newInvalid()">
      <div class="strength" aria-hidden="true">
        @for (bar of bars; track bar) {
          <span class="strength__bar" [class.strength__bar--short]="bar <= level() && !longEnough()"
                [class.strength__bar--ok]="bar <= level() && longEnough()"></span>
        }
      </div>
      <p id="new-password-hint" class="password-form__hint" [class.password-form__hint--ok]="longEnough()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        Mínimo {{ minLength }} caracteres ({{ newLength() < minLength ? newLength() : minLength }}/{{ minLength }})
      </p>
    </div>
  </section>

  <button type="submit" class="btn-primary password-form__submit" [disabled]="saving()" [attr.aria-busy]="saving()">
    Guardar nueva contraseña
  </button>
</form>
