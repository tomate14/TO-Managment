<header class="page-header">
  <a class="page-header__back" [routerLink]="backLink" aria-label="Volver">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
  </a>
  <h1 class="page-header__title">{{ isEdit ? 'Editar paciente' : 'Nuevo paciente' }}</h1>
</header>

<app-patient-form [patientId]="patientId" [cancelLink]="backLink" (saved)="onSaved($event)" />
