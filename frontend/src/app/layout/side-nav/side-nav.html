<nav class="side-nav" aria-label="Navegación principal">
  <div class="side-nav__brand">
    <div class="side-nav__logo">TO</div>
    <div class="side-nav__brand-text">
      <span class="side-nav__title">Terapia Ocupacional</span>
      <span class="side-nav__subtitle">Gestión clínica</span>
    </div>
  </div>

  <div class="side-nav__links">
    @for (item of items; track item.path) {
      <a
        class="side-nav__link"
        [routerLink]="item.path"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
      >
        @switch (item.icon) {
          @case ('patients') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"></path></svg>
          }
          @case ('templates') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5"></rect><path d="M9 3h6v3H9z"></path><path d="M9 11h6M9 15h6M9 19h3"></path></svg>
          }
        }{{ item.label }}</a>
    }
  </div>

  @if (user(); as currentUser) {
    <div class="side-nav__footer">
      <div class="side-nav__user">
        <div class="side-nav__avatar">{{ initials(currentUser.fullName) }}</div>
        <div class="side-nav__user-text">
          <span class="side-nav__user-name">{{ currentUser.fullName }}</span>
          <span class="side-nav__user-role">{{ roleLabels[currentUser.role] }}</span>
        </div>
      </div>
      <button type="button" class="side-nav__link side-nav__action" (click)="logout()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 16l-4-4 4-4M6 12h10"></path></svg>Cerrar sesión
      </button>
    </div>
  }
</nav>
